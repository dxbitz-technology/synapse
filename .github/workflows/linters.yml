name: Linters

on:
  push:
    branches: [develop, version-16, main]
  pull_request:

concurrency:
  group: linters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.22
      - run: ruff check .
      - run: ruff format --check .
